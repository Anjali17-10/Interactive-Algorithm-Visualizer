<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-blue-100 flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">

<h1 class="text-3xl font-bold text-center mb-6">
Register
</h1>

<input
id="name"
type="text"
placeholder="Name"
class="border w-full p-3 rounded mb-4"
/>

<input
id="email"
type="email"
placeholder="Email"
class="border w-full p-3 rounded mb-4"
/>

<input
id="password"
type="password"
placeholder="Password"
class="border w-full p-3 rounded mb-6"
/>

<button
onclick="registerUser()"
class="bg-blue-600 w-full text-white p-3 rounded hover:bg-blue-700">

Register

</button>

<p class="text-center mt-5">
Already have an account?

<a
href="login.html"
class="text-blue-600 font-bold">

Login

</a>

</p>

</div>

<script>

async function registerUser() {

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!name || !email || !password) {
        alert("Please fill all fields");
        return;
    }

    try {

const response = await fetch("https://interactive-algorithm-visualizer-9.onrender.com/api/auth/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name,
                email,
                password
            })

        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {

            localStorage.setItem("email", email);

            window.location.href = "verify-otp.html";

        }

    } catch (error) {

        console.log(error);

        alert("Server Error");

    }

}
document.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        registerUser();

    }

});
</script>

</body>
</html>
