<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Profile</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-blue-100 min-h-screen flex justify-center items-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-96 text-center">

<h1 class="text-3xl font-bold mb-6">

Profile

</h1>

<p id="name" class="mb-3"></p>

<p id="email" class="mb-3"></p>

<p id="role" class="mb-6"></p>
<h2 class="text-2xl font-bold mt-6 mb-3">
    Completed Algorithms
</h2>

<p
id="completedCount"
class="text-2xl font-semibold text-blue-600 mb-6">

0 / 90 Completed

</p>
<a
href="dashboard.html"
class="bg-blue-600 text-white px-5 py-2 rounded">

Back

</a>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user){
    window.location.href = "login.html";
}

document.getElementById("name").textContent=
`Name : ${user.name}`;

document.getElementById("email").textContent=
`Email : ${user.email}`;

document.getElementById("role").textContent=
`Role : ${user.role}`;

async function loadProgress(){

  const response = await fetch(
  `https://interactive-algorithm-visualizer-9.onrender.com/api/progress/${user.email}`
);

    const data = await response.json();

    document.getElementById("completedCount").textContent =
        `${data.completed.length} / 90 Completed`;

}
loadProgress();
</script>

</body>

</html>
