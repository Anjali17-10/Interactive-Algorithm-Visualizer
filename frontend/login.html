<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-blue-100 flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">

<h1 class="text-3xl font-bold text-center mb-6">

Login

</h1>

<input
id="email"
type="email"
placeholder="Email"
class="border w-full p-3 rounded mb-4"
/>

<input
id="password"
type="password"
placeholder="Password"
class="border w-full p-3 rounded mb-6"
/>

<button
onclick="loginUser()"
class="bg-blue-600 w-full text-white p-3 rounded hover:bg-blue-700">

Login

</button>

<p class="text-center mt-5">

Don't have an account?

<a
href="register.html"
class="text-blue-600 font-bold">

Register

</a>

</p>

</div>

<script>

async function loginUser(){

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value.trim();

if(!email || !password){

alert("Please fill all fields");

return;

}

try{

const response = await fetch("https://interactive-algorithm-visualizer-13.onrender.com/api/auth/login", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password

})

});
//console.log("Status:", response.status);


const data=await response.json();
//console.log("Response:", data);
alert(data.message);

if(data.success){

localStorage.setItem("token",data.token);

localStorage.setItem("user",JSON.stringify(data.user));

window.location.href="Dashboard.html";

}

}catch(error){

console.log(error);

alert("Something went wrong");

}

}

</script>

</body>

</html>
