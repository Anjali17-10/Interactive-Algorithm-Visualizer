<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 flex justify-center items-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-xl w-96">

        <h1 class="text-3xl font-bold text-center mb-3">
            Verify OTP
        </h1>

        <p id="emailText"
            class="text-center text-gray-500 text-sm mb-6">
        </p>

        <input
            id="otp"
            type="text"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
            class="border w-full p-3 rounded-lg mb-5 focus:outline-none focus:ring-2 focus:ring-green-500"
        />

        <button
            onclick="verifyOTP()"
            class="bg-green-600 hover:bg-green-700 text-white w-full p-3 rounded-lg font-semibold transition">

            Verify OTP

        </button>

        <p class="text-center mt-5 text-sm text-gray-500">

            Didn't receive the OTP?

            <span class="text-blue-600 font-semibold cursor-pointer">
                Check your inbox
            </span>

        </p>

    </div>

<script>

const email = localStorage.getItem("email");

if(!email){

    alert("Please register first.");

    window.location.href="register.html";

}

document.getElementById("emailText").textContent =
`OTP sent to ${email}`;

async function verifyOTP(){

    const otp = document.getElementById("otp").value.trim();

    if(!otp){

        alert("Please enter OTP");

        return;

    }

    try{

const response = await fetch("https://interactive-algorithm-visualizer-7.onrender.com/api/auth/verify-otp", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email,
                otp
            })

        });

        const data = await response.json();

        alert(data.message);

        if(data.success){

            localStorage.removeItem("email");

            window.location.href="login.html";

        }

    }catch(error){

        console.log(error);

        alert("Server Error");

    }

}

document.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        verifyOTP();

    }

});

</script>

</body>

</html>
