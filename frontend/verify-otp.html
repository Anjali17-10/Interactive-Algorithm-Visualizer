<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>

    <link rel="stylesheet" href="public/output.css">
</head>

<body class="bg-blue-100 flex justify-center items-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-xl w-96">

        <h1 class="text-3xl font-bold text-center mb-3">
            Verify OTP
        </h1>

        <p id="emailText"
            class="text-center text-gray-500 text-sm mb-6">
        </p>

        <input
            id="otp"
            type="text"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
            class="border w-full p-3 rounded-lg mb-5 focus:outline-none focus:ring-2 focus:ring-green-500"
        />

        <button
            onclick="verifyOTP()"
            class="bg-green-600 hover:bg-green-700 text-white w-full p-3 rounded-lg font-semibold transition">

            Verify OTP

        </button>

        <p class="text-center mt-5 text-sm text-gray-500">

            Didn't receive the OTP?

            <span id="resendBtn" onclick="resendOTP()" class="text-blue-600 font-semibold cursor-pointer hover:underline">
                Resend OTP
            </span>

        </p>

    </div>

<script>

const email = localStorage.getItem("email");

if(!email){

    alert("Please register first.");

    window.location.href="register.html";

}

document.getElementById("emailText").textContent =
`OTP sent to ${email}`;

async function verifyOTP(){

    const otp = document.getElementById("otp").value.trim();

    if(!otp){

        alert("Please enter OTP");

        return;

    }

    const btn = document.querySelector("button");
    btn.innerHTML = "Verifying...";
    btn.disabled = true;

    try{
        const response = await fetch("https://interactive-algorithm-visualizer-13.onrender.com/api/auth/verify-otp", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ email, otp })
        });
        const data = await response.json();
        alert(data.message);
        if(data.success){
            localStorage.removeItem("email");
            window.location.href="login.html";
        }
    }catch(error){
        console.log(error);
        alert("Server Error");
    } finally {
        btn.innerHTML = "Verify OTP";
        btn.disabled = false;
    }
}

async function resendOTP(){
    const resendBtn = document.getElementById("resendBtn");
    resendBtn.innerHTML = "Sending...";
    resendBtn.style.pointerEvents = "none";
    
    try{
        const response = await fetch("https://interactive-algorithm-visualizer-13.onrender.com/api/auth/resend-otp", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ email })
        });
        const data = await response.json();
        alert(data.message);
    }catch(error){
        console.log(error);
        alert("Server Error");
    } finally {
        resendBtn.innerHTML = "Resend OTP";
        resendBtn.style.pointerEvents = "auto";
    }
}

document.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        verifyOTP();

    }

});

</script>

</body>

</html>
